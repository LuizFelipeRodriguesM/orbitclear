<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catálogo de objetos · OrbitClear</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<style>
  /* ============================================================
     OrbitClear — CATÁLOGO DE OBJETOS (página interna)
     Mesma pele da landing: Bricolage no display, paleta por token,
     profundidade por degrau de cor (sem drop shadow), hover -4px com
     cubic-bezier(.175,.885,.32,1.275), ember escasso e ligado a dado
     real (risco CRÍTICO). Prefixo .obj- pra não colidir com base.css.
     ============================================================ */

  /* gutter editorial largo — idêntico ao da landing (eixo do .container, sem cartão) */
  .ed-bleed { padding-inline: clamp(20px, 5.5vw, 96px); }

  /* ---------- header editorial da página (contrato comum às internas) ---------- */
  .pg-head { padding-block: clamp(40px, 6vw, 84px) clamp(22px, 3vw, 40px); display: grid; gap: clamp(12px,1.4vw,16px); }
  .pg-head .pg-eyebrow { font-size: var(--text-caption); letter-spacing: .2em; text-transform: uppercase; font-weight: 600; color: var(--color-steel); }
  .pg-title { margin: 0; font-family: 'Bricolage Grotesque','DM Sans',sans-serif; font-weight: 800;
    font-size: clamp(34px, 5vw, 58px); line-height: 1.0; letter-spacing: -.03em; color: var(--color-obsidian); }
  .pg-sub { margin: 0; max-width: 56ch; font-size: var(--text-body-lg); line-height: var(--leading-body-lg); color: var(--color-steel); }
  .pg-count { justify-self: start; }

  /* badge de contagem com ponto "vivo" — mesma linguagem do figcaption da landing */
  .pg-count {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: var(--text-caption); letter-spacing: .14em; text-transform: uppercase;
    font-weight: var(--font-weight-semibold); color: var(--color-slate);
    background: var(--color-snow); border: 1px solid var(--color-pebble);
    border-radius: var(--radius-pill); padding: 6px 14px;
    box-shadow: var(--shadow-card-inset);
  }
  .pg-count .pg-live {
    width: 6px; height: 6px; border-radius: 50%; flex: none;
    background: var(--color-ember); box-shadow: 0 0 0 3px rgba(255,90,0,.16);
  }

  /* ---------- grelha de catálogo ---------- */
  .obj-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: clamp(14px, 1.4vw, 24px);
    padding-bottom: clamp(56px, 8vw, 104px);
  }

  /* ---------- card de objeto — pele da landing (.ed-tile) aplicada ao card ---------- */
  .obj-card {
    position: relative;
    display: flex; flex-direction: column;
    gap: var(--spacing-16);
    background: var(--surface-card-white);
    border: 1px solid var(--color-fog);
    border-radius: clamp(28px, 2.4vw, 36px);
    padding: clamp(22px, 2vw, 30px);
    isolation: isolate;
    transition: transform .25s cubic-bezier(.175,.885,.32,1.275), border-color .25s ease;
    will-change: transform;
  }
  .obj-card:hover { transform: translateY(-4px); border-color: var(--color-pebble); }

  /* CRÍTICO: único acento cromático, ligado a dado real */
  .obj-card.is-critico { border-color: rgba(255,90,0,.30); }
  .obj-card.is-critico::before {
    content: "";
    position: absolute; inset: 0; z-index: -1;
    border-radius: inherit;
    background: radial-gradient(120% 90% at 92% 0%, rgba(255,90,0,.07), transparent 52%);
  }

  /* topo: nome (display) + badge de risco */
  .obj-top { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--spacing-12); }
  .obj-name {
    margin: 0;
    font-family: 'Bricolage Grotesque','DM Sans',sans-serif;
    font-weight: 700;
    font-size: var(--text-heading-sm);
    line-height: 1.16;
    letter-spacing: -.02em;
    color: var(--color-obsidian);
  }

  /* badge de risco — reusa .risk do base.css; só o CRÍTICO ganha ember */
  .obj-card .risk { flex: none; white-space: nowrap; }
  .obj-card.is-critico .risk-critico {
    background: var(--color-ember);
    color: #fff;
  }

  /* fileira de badges tipo + status */
  .obj-tags { display: flex; flex-wrap: wrap; gap: var(--spacing-8); align-items: center; }

  /* specs: altitude · massa · operador (mesma régua de leitura da landing) */
  .obj-specs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--spacing-12);
    padding: var(--spacing-16) 0;
    border-top: 1px solid var(--color-fog);
    border-bottom: 1px solid var(--color-fog);
  }
  .obj-spec { display: grid; gap: 3px; min-width: 0; }
  .obj-spec-k {
    font-size: var(--text-caption); letter-spacing: .08em; text-transform: uppercase;
    color: var(--color-ash); font-weight: var(--font-weight-semibold);
  }
  .obj-spec-v {
    font-size: var(--text-body); font-weight: var(--font-weight-semibold);
    color: var(--color-ink); letter-spacing: -.01em;
    font-variant-numeric: tabular-nums;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }

  /* selo "Impacto na Terra" — diferencial de nota (reusa .impacto do base.css) */
  .obj-card .impacto { margin-top: auto; }

  /* CTA — alinhado ao fim, estilo consistente com a landing */
  .obj-cta { width: 100%; }

  /* ---------- responsivo ---------- */
  @media (max-width: 980px) {
    .obj-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .obj-grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 420px) {
    .obj-specs { grid-template-columns: 1fr 1fr; }
  }

  /* ---------- motion reset ---------- */
  @media (prefers-reduced-motion: reduce) {
    .obj-card { transition: none; }
    .obj-card:hover { transform: none; }
  }
</style>
</head>
<body>
<header class="nav"><div class="container nav-inner"><a href="index.html" class="brand"><span class="brand-dot"></span>OrbitClear</a><nav class="nav-links"><a href="objetos.html" class="nav-link is-active">Objetos</a><a href="operadores.html" class="nav-link">Operadores</a><a href="contratos.html" class="nav-link">Contratos</a><a href="contratos.html" class="btn btn-primary">Agendar remoção</a></nav></div></header>

<main>
  <!-- ===================== HEADER EDITORIAL ===================== -->
  <section class="pg-head ed-bleed">
    <span class="pg-eyebrow">Catálogo · simulação</span>
    <h1 class="pg-title">Detritos em órbita baixa</h1>
    <p class="pg-sub">Cada objeto rastreado, com seu nível de risco e o impacto direto na Terra.</p>
    <span class="pg-count" id="contagem"><span class="pg-live" aria-hidden="true"></span>0 objetos</span>
  </section>

  <!-- ===================== GRID DE OBJETOS (render via JS) ===================== -->
  <section class="ed-bleed" aria-label="Objetos rastreados, ordenados por risco">
    <div id="grid" class="obj-grid"></div>
  </section>
</main>

<footer class="footer container"><span>OrbitClear · Marketplace de remoção de lixo espacial</span><span class="muted">Global Solution 2026/1 · FIAP Eng. de Software · Grupo 89</span></footer>

<script src="js/data.js"></script>
<script>
  (function () {
    'use strict';

    var objetos = window.OBJETOS || [];
    var L = window.LABELS || {};
    var IMPACTO = window.IMPACTO_TERRA || {};

    // contagem real no badge do cabeçalho (preserva o ponto "vivo")
    var contagem = document.getElementById('contagem');
    if (contagem) {
      contagem.innerHTML = '<span class="pg-live" aria-hidden="true"></span>' + objetos.length + ' objetos';
    }

    // ordena por gravidade: CRÍTICO -> ALTO -> MÉDIO -> BAIXO
    var ordemRisco = { CRITICO: 0, ALTO: 1, MEDIO: 2, BAIXO: 3 };
    var ordenados = objetos.slice().sort(function (a, b) {
      return (ordemRisco[a.nivelRiscoColisao] != null ? ordemRisco[a.nivelRiscoColisao] : 9)
           - (ordemRisco[b.nivelRiscoColisao] != null ? ordemRisco[b.nivelRiscoColisao] : 9);
    });

    var grid = document.getElementById('grid');
    var frag = document.createDocumentFragment();

    // helpers de criação de DOM (sem libs)
    function el(tag, className) {
      var node = document.createElement(tag);
      if (className) node.className = className;
      return node;
    }
    function txt(tag, className, text) {
      var node = el(tag, className);
      node.textContent = text;
      return node;
    }
    function lbl(group, key) {
      return (L[group] && L[group][key]) || key;
    }

    ordenados.forEach(function (obj) {
      var riskKey = String(obj.nivelRiscoColisao).toLowerCase();
      var isCritico = obj.nivelRiscoColisao === 'CRITICO';

      var card = el('article', 'obj-card' + (isCritico ? ' is-critico' : ''));

      // 1) topo: nome (display) + badge de risco (ember só no CRÍTICO)
      var top = el('div', 'obj-top');
      top.appendChild(txt('h2', 'obj-name', obj.nome));
      top.appendChild(txt('span', 'risk risk-' + riskKey, lbl('risco', obj.nivelRiscoColisao)));
      card.appendChild(top);

      // 2) tags: tipo (soft) + status (dark)
      var tags = el('div', 'obj-tags');
      tags.appendChild(txt('span', 'badge badge-soft', lbl('tipo', obj.tipo)));
      tags.appendChild(txt('span', 'badge badge-dark', lbl('status', obj.statusRemocao)));
      card.appendChild(tags);

      // 3) specs: altitude · massa · operador (agência dona)
      var specs = el('div', 'obj-specs');
      [
        ['Altitude', window.fmtKm ? window.fmtKm(obj.altitudeKm) : obj.altitudeKm + ' km'],
        ['Massa',    window.fmtKg ? window.fmtKg(obj.massaKg)    : obj.massaKg + ' kg'],
        ['Operador', window.clientePorId ? window.clientePorId(obj.clienteId) : '—']
      ].forEach(function (pair) {
        var item = el('div', 'obj-spec');
        item.appendChild(txt('span', 'obj-spec-k', pair[0]));
        item.appendChild(txt('span', 'obj-spec-v', pair[1]));
        specs.appendChild(item);
      });
      card.appendChild(specs);

      // 4) selo "Impacto na Terra" — diferencial de nota (NÃO remover)
      var impacto = el('div', 'impacto');
      var ic = el('div', 'impacto-ic');
      ic.textContent = '🌍';
      impacto.appendChild(ic);
      var impText = el('div', 'stack-8');
      impText.appendChild(txt('div', 'impacto-label', 'Impacto na Terra'));
      impText.appendChild(txt('div', 'impacto-text', IMPACTO[obj.nivelRiscoColisao] || '—'));
      impacto.appendChild(impText);
      card.appendChild(impacto);

      // 5) CTA -> contratos
      var cta = el('a', 'btn btn-outline btn-block obj-cta');
      cta.href = 'contratos.html';
      cta.textContent = 'Solicitar remoção';
      card.appendChild(cta);

      frag.appendChild(card);
    });

    if (grid) grid.appendChild(frag);
  })();
</script>
</body>
</html>
